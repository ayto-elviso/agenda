<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2942" />
  <meta name="description" content="Aquí encontrarás todos los eventos, actividades y citas culturales de El Viso de los Pedroches." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Agenda de El Viso" />
  <meta property="og:description" content="Todos los eventos, actividades y citas culturales de El Viso de los Pedroches." />
  <meta property="og:image" content="https://ayto-elviso.github.io/agenda/cabecera.jpg" />
  <title>Agenda de El Viso</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="preload" as="image" href="cabecera.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f2942;
      --bg-page: #f3f5f8;
      --bg-card: #ffffff;
      --bg-soft: #eef2f7;
      --text-main: #182230;
      --text-muted: #526075;
      --border: #e2e8f0;
      --border-strong: #dbe3ee;
      --shadow-card: 0 1px 3px rgba(15, 41, 66, 0.06);
    }

    * { box-sizing: border-box; }

    html { scroll-padding-top: 56px; }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button { font-family: inherit; cursor: pointer; }
    a { color: var(--navy); }
    :focus-visible { outline: 3px solid #6aa7ff; outline-offset: 2px; }

    /* ---------- Cabecera ---------- */
    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding-bottom: 22px;
    }
    .header-banner { height: 150px; background: var(--navy); }
    .header-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .header-logo-wrap {
      width: 92px; height: 92px;
      margin: -46px auto 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(15, 41, 66, 0.16);
      padding: 10px;
      position: relative;
    }
    .header-logo-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; display: block; }
    .header-title {
      margin: 0;
      font-size: 28px; line-height: 1.15; font-weight: 800;
      letter-spacing: -0.02em; color: var(--navy);
    }
    .header-subtitle {
      margin: 8px auto 0; max-width: 300px; padding: 0 8px;
      font-size: 14px; line-height: 1.5; color: var(--text-muted);
    }

    /* ---------- Contenido ---------- */
    .main-container { max-width: 720px; margin: 0 auto; }

    /* Mes pegajoso: no poner overflow en body ni en contenedores superiores */
    .month-heading {
      position: sticky; top: 0; z-index: 5;
      margin: 0; height: 50px;
      display: flex; align-items: center; gap: 11px;
      padding: 0 16px;
      background: var(--navy); color: #fff;
      font-size: 18px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .month-heading::before {
      content: ''; width: 5px; height: 22px; border-radius: 3px; background: #60a5fa;
    }
    .events-list { display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 22px; }

    /* ---------- Tarjeta ---------- */
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
    }
    .badge {
      font-size: 11.5px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    }
    .badge-hoy { background: #1a66c9; color: #fff; }
    .badge-manana { background: var(--navy); color: #fff; }
    .badge-semana { background: #dbeafe; color: #1e3a8a; }
    .badge-curso { background: #fff; color: var(--navy); border: 1px solid #c3d3e6; }
    .badge { margin-left: auto; flex: 0 0 auto; }

    .event-content { padding: 16px; }
    .event-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .event-emoji-ball {
      width: 54px; height: 54px; flex: 0 0 auto;
      border-radius: 50%; background: var(--bg-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; line-height: 1;
    }
    .event-title {
      margin: 0; min-width: 0; font-size: 20px; line-height: 1.25; font-weight: 800;
      color: var(--text-main); letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }

    .event-info { display: flex; flex-direction: column; gap: 8px; }
    .info-date { flex: 1; min-width: 0; font-weight: 800; color: var(--navy); }
    .info-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 14.5px; font-weight: 600; line-height: 1.35; color: var(--text-main);
    }
    .info-row > span:last-child { min-width: 0; overflow-wrap: anywhere; }
    .info-icon {
      width: 30px; height: 30px; flex: 0 0 auto;
      border-radius: 50%; background: var(--bg-soft); color: var(--navy);
      display: flex; align-items: center; justify-content: center;
    }
    .info-icon svg { width: 17px; height: 17px; }

    .event-desc { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--text-muted); }

    .event-actions {
      display: flex; gap: 8px;
      margin-top: 14px; padding-top: 14px;
      border-top: 2px dotted #cbd5e1;
    }
    .btn {
      min-height: 46px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 14px; font-weight: 700; text-decoration: none;
    }
    .btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .btn-primary { flex: 1; border: 0; background: var(--navy); color: #fff; }
    .btn-primary svg { width: 16px; height: 16px; transition: transform .2s; }
    .btn-primary[aria-expanded="true"] svg { transform: rotate(180deg); }
    .btn-save {
      padding: 0 12px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border-strong); background: #fff; color: var(--navy);
    }
    .btn-share {
      width: 46px; border: 1px solid #bfe3cc; background: #f0faf4; color: #15803d;
    }
    .btn-share svg { width: 18px; height: 18px; }
    .btn-only-save { flex: 1; }

    .cal-wrapper { position: relative; display: flex; }
    .cal-wrapper.grow { flex: 1; }
    .cal-wrapper.grow .btn-save { flex: 1; }
    .cal-menu {
      position: absolute; right: 0; bottom: calc(100% + 8px);
      min-width: 220px; z-index: 20;
      background: #fff; border: 1px solid var(--border-strong); border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 41, 66, 0.18);
      padding: 6px; display: flex; flex-direction: column;
    }
    .cal-menu[hidden] { display: none; }
    .cal-menu a, .cal-menu button {
      display: block; width: 100%; text-align: left;
      padding: 12px 12px; border: 0; background: transparent; border-radius: 8px;
      font-size: 14px; font-weight: 600; color: var(--text-main); text-decoration: none;
    }
    .cal-menu a:hover, .cal-menu button:hover { background: var(--bg-soft); }

    .btn-poster {
      margin-top: 10px; min-height: 44px; padding: 0 2px; gap: 7px;
      border: 0; background: transparent; color: var(--text-muted);
      font-size: 13.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
    }
    .btn-poster svg { width: 16px; height: 16px; }
    .btn-poster:hover { color: var(--navy); }

    .poster-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .poster-modal[hidden] { display: none; }
    .poster-backdrop { position: absolute; inset: 0; background: rgba(10, 20, 35, 0.86); }
    .poster-panel {
      position: relative; width: 100%; max-width: 520px; max-height: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .poster-top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .poster-title { margin: 0; color: #fff; font-size: 15px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .poster-close {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%;
      border: 0; background: rgba(255, 255, 255, 0.16); color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .poster-close svg { width: 22px; height: 22px; }
    .poster-stage { display: flex; align-items: center; justify-content: center; min-height: 120px; max-width: 100%; }
    .poster-stage img {
      display: block; max-width: 100%; max-height: calc(100vh - 170px); max-height: calc(100dvh - 170px);
      border-radius: 10px; background: #fff;
    }
    .poster-stage img[hidden] { display: none; }
    .poster-stage .spinner { border-color: rgba(255, 255, 255, 0.3); border-top-color: #fff; margin: 0; }
    .poster-error { margin: 0; color: #fff; font-size: 14px; text-align: center; }
    .poster-error[hidden] { display: none; }
    .poster-open { color: #fff; font-size: 14px; font-weight: 600; padding: 10px 14px; }

    .program-list {
      list-style: none; margin: 14px 0 0; padding: 4px 14px;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
    }
    .program-list[hidden] { display: none; }
    .program-list li {
      padding: 10px 0; font-size: 14px; line-height: 1.4; color: var(--text-main);
      border-bottom: 1px dotted #cbd5e1;
    }
    .program-list li:last-child { border-bottom: 0; }

    /* ---------- Estados y pie ---------- */
    .state-box { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 15px; line-height: 1.5; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 14px;
      border: 3px solid var(--border-strong); border-top-color: var(--navy);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .site-footer { padding: 4px 16px 32px; text-align: center; font-size: 12px; color: var(--text-muted); }
    .site-footer p { margin: 4px 0; }

    @media (min-width: 700px) {
      .header-banner { height: 220px; }
      .header-title { font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
      .btn-primary svg { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-banner">
      <img src="cabecera.jpg" width="828" height="315" alt="" />
    </div>
    <div class="header-logo-wrap">
      <img src="logo.jpg" width="1080" height="1080" alt="Escudo de El Viso" />
    </div>
    <h1 class="header-title">Agenda de El Viso</h1>
    <p class="header-subtitle">Aquí encontrarás todos los eventos, actividades y citas culturales de El Viso de los Pedroches.</p>
  </header>

  <main class="main-container" id="agendaContainer">
    <div class="state-box" id="loadingState">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando programación actualizada…</p>
    </div>
  </main>

  <div class="poster-modal" id="posterModal" role="dialog" aria-modal="true" aria-labelledby="posterTitle" hidden>
    <div class="poster-backdrop" data-poster-close></div>
    <div class="poster-panel">
      <div class="poster-top">
        <p class="poster-title" id="posterTitle"></p>
        <button type="button" class="poster-close" id="posterClose" data-poster-close aria-label="Cerrar cartel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="poster-stage">
        <div class="spinner" id="posterSpinner" aria-hidden="true"></div>
        <img id="posterImg" alt="" hidden />
      </div>
      <p class="poster-error" id="posterError" hidden>No se ha podido cargar el cartel.</p>
      <a class="poster-open" id="posterOpen" target="_blank" rel="noopener noreferrer">Abrir en otra pestaña</a>
    </div>
  </div>

  <footer class="site-footer">
    <p id="updateInfo">Ayuntamiento de El Viso</p>
  </footer>

  <script>
    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */
    const SHEET_ID = '1ZQwG-G8eXJAhazxRedvAp55pHL5357xH2nWGz3hzzsE';
    const SHEET_NAME = 'Eventos';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const CACHE_KEY = 'agenda-el-viso-cache-v1';

    // Si un título está escrito TODO en mayúsculas en el Excel, se muestra con
    // mayúscula inicial en cada palabra importante. Pon false para respetarlo tal cual.
    const NORMALIZE_UPPERCASE_TITLES = true;

    const DAYS_FULL = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const DAYS_SHORT = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const MONTHS_SHORT = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const MONTHS_FULL = [
      'ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO',
      'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'
    ];
    const LOWER_WORDS = new Set(['a', 'al', 'con', 'de', 'del', 'e', 'el', 'en', 'la', 'las', 'lo', 'los', 'o', 'para', 'por', 'u', 'un', 'una', 'y']);

    let currentEvents = [];

    /* =========================================================
       UTILIDADES
       ========================================================= */
    const pad = (n) => String(n).padStart(2, '0');

    function parseSheetDate(raw) {
      if (!raw) return null;
      const str = String(raw).trim();
      if (!str) return null;

      const gvizMatch = str.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)/);
      if (gvizMatch) return new Date(Number(gvizMatch[1]), Number(gvizMatch[2]), Number(gvizMatch[3]));

      const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (isoMatch) return new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]));

      const esMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (esMatch) return new Date(Number(esMatch[3]), Number(esMatch[2]) - 1, Number(esMatch[1]));

      return null;
    }

    function isSameDay(a, b) {
      return !!a && !!b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function startOfToday() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function daysBetween(from, to) {
      return Math.round((to - from) / 86400000);
    }

    // Devuelve todas las horas encontradas en minutos: "18:00 a 20:00 h" -> [1080, 1200]
    function extractTimes(horaStr) {
      const result = [];
      const re = /(\d{1,2}):(\d{2})/g;
      let m;
      while ((m = re.exec(String(horaStr || ''))) !== null) {
        const hh = Number(m[1]);
        const mm = Number(m[2]);
        if (hh < 24 && mm < 60) result.push(hh * 60 + mm);
      }
      return result;
    }

    function parseTimeMinutes(horaStr) {
      const t = extractTimes(horaStr);
      return t.length ? t[0] : 9999;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function linkify(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function prettyTitle(title) {
      const t = String(title || '').trim();
      if (!NORMALIZE_UPPERCASE_TITLES) return t;
      if (t !== t.toUpperCase() || t === t.toLowerCase()) return t; // ya viene en minúsculas/mixto
      return t.toLowerCase().split(/(\s+)/).map((word, i) => {
        if (/^\s+$/.test(word) || !word) return word;
        const bare = word.replace(/[^a-záéíóúüñ]/gi, '');
        if (i > 0 && LOWER_WORDS.has(bare)) return word;
        return word.replace(/[a-záéíóúüñ]/i, (c) => c.toUpperCase());
      }).join('');
    }

    function formatDateLabel(ev) {
      const s = ev.startDate;
      const e = ev.endDate;
      if (!e || isSameDay(s, e)) {
        return `${DAYS_FULL[s.getDay()]} ${s.getDate()} ${MONTHS_SHORT[s.getMonth()]}`;
      }
      return `${DAYS_SHORT[s.getDay()]} ${s.getDate()} ${MONTHS_SHORT[s.getMonth()]} – ${DAYS_SHORT[e.getDay()]} ${e.getDate()} ${MONTHS_SHORT[e.getMonth()]}`;
    }

    function getBadge(ev, today) {
      const isRange = !isSameDay(ev.startDate, ev.endDate);
      if (isSameDay(ev.startDate, today)) return { cls: 'badge-hoy', text: 'Hoy' };
      if (ev.startDate < today && ev.endDate >= today) {
        return isRange ? { cls: 'badge-curso', text: 'En curso' } : null;
      }
      const d = daysBetween(today, ev.startDate);
      if (d === 1) return { cls: 'badge-manana', text: 'Mañana' };
      if (d >= 2 && d <= 7) return { cls: 'badge-semana', text: 'Esta semana' };
      return null;
    }

    /* =========================================================
       CALENDARIO (Google Calendar / .ics) Y WHATSAPP
       ========================================================= */
    const fmtDate = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;

    function fmtDateTime(d, minutes) {
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, minutes);
      return `${fmtDate(dt)}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
    }

    // Eventos de un día con hora: usa el tramo horario si existe (o 1 hora por defecto).
    // Si termina antes de empezar (p. ej. 23:30 a 01:00) pasa al día siguiente.
    function getEventTiming(ev) {
      const times = extractTimes(ev.hora);
      if (times.length && isSameDay(ev.startDate, ev.endDate)) {
        const start = times[0];
        let end = times.length > 1 ? times[1] : start + 60;
        if (end <= start) end += 1440;
        return { timed: true, start: fmtDateTime(ev.startDate, start), end: fmtDateTime(ev.startDate, end) };
      }
      const next = new Date(ev.endDate.getFullYear(), ev.endDate.getMonth(), ev.endDate.getDate() + 1);
      return { timed: false, start: fmtDate(ev.startDate), end: fmtDate(next) };
    }

    function buildDetails(ev) {
      const parts = [];
      if (ev.descripcion) parts.push(ev.descripcion);
      if (ev.programa) parts.push('Programa: ' + ev.programa.replace(/\s*\|\s*/g, ' · '));
      if (ev.inscripcion) parts.push('Inscripción: ' + ev.inscripcion);
      return parts.join('\n\n');
    }

    function buildLocation(ev) {
      return ev.lugar ? `${ev.lugar}, El Viso (Córdoba)` : 'El Viso, Córdoba';
    }

    function buildGoogleCalendarUrl(ev) {
      const t = getEventTiming(ev);
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: prettyTitle(ev.titulo),
        dates: `${t.start}/${t.end}`,
        details: buildDetails(ev),
        location: buildLocation(ev),
        ctz: 'Europe/Madrid'
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function escapeIcs(text) {
      return String(text || '')
        .replace(/\\/g, '\\\\')
        .replace(/;/g, '\\;')
        .replace(/,/g, '\\,')
        .replace(/\r?\n/g, '\\n');
    }

    // Las líneas de un .ics no deben pasar de 75 bytes: se parten y continúan con un espacio.
    function foldIcsLine(line) {
      const enc = new TextEncoder();
      const out = [];
      let current = '';
      let bytes = 0;
      for (const ch of line) {
        const len = enc.encode(ch).length;
        const limit = out.length === 0 ? 75 : 74;
        if (bytes + len > limit) {
          out.push(current);
          current = '';
          bytes = 0;
        }
        current += ch;
        bytes += len;
      }
      out.push(current);
      return out.join('\r\n ');
    }

    function slugify(text) {
      return String(text || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'evento';
    }

    function downloadIcsFile(ev) {
      const t = getEventTiming(ev);
      const title = prettyTitle(ev.titulo);
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Ayuntamiento de El Viso//Agenda Publica//ES',
        'CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        `UID:${fmtDate(ev.startDate)}-${slugify(title)}@elviso.es`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        t.timed ? `DTSTART:${t.start}` : `DTSTART;VALUE=DATE:${t.start}`,
        t.timed ? `DTEND:${t.end}` : `DTEND;VALUE=DATE:${t.end}`,
        `SUMMARY:${escapeIcs(title)}`,
        `DESCRIPTION:${escapeIcs(buildDetails(ev))}`,
        `LOCATION:${escapeIcs(buildLocation(ev))}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].map(foldIcsLine);

      const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${slugify(title)}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function buildWhatsAppUrl(ev) {
      const lines = [`${ev.emoji ? ev.emoji + ' ' : ''}*${prettyTitle(ev.titulo)}*`];
      lines.push(formatDateLabel(ev) + (ev.hora ? ` · ${ev.hora}` : ''));
      if (ev.lugar) lines.push(`Lugar: ${ev.lugar}`);
      lines.push('', 'Agenda de El Viso: ' + location.origin + location.pathname);
      return 'https://wa.me/?text=' + encodeURIComponent(lines.join('\n'));
    }

    /* =========================================================
       CARTEL
       ========================================================= */
    // Acepta un enlace de Google Drive (/file/d/ID/..., open?id=ID, uc?id=ID),
    // cualquier enlace https a una imagen, o el nombre de un archivo del repositorio.
    function resolvePoster(raw) {
      const value = String(raw || '').trim();
      if (!value) return null;

      if (/^https?:\/\/(drive|docs)\.google\.com\//i.test(value)) {
        const m = value.match(/\/d\/([\w-]{10,})/) || value.match(/[?&]id=([\w-]{10,})/);
        if (!m) return null;
        return {
          src: `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`,
          open: `https://drive.google.com/file/d/${m[1]}/view`
        };
      }
      if (/^https:\/\//i.test(value)) return { src: value, open: value };
      if (!/^[a-z][a-z0-9+.-]*:/i.test(value) && !value.startsWith('//')) {
        return { src: encodeURI(value), open: encodeURI(value) };
      }
      return null; // http:, javascript:, data:, etc. no se admiten
    }

    let posterFocusReturn = null;

    function openPoster(ev, trigger) {
      const poster = resolvePoster(ev.cartel);
      if (!poster) return;
      const modal = document.getElementById('posterModal');
      const img = document.getElementById('posterImg');
      const spinner = document.getElementById('posterSpinner');
      const error = document.getElementById('posterError');

      posterFocusReturn = trigger || null;
      document.getElementById('posterTitle').textContent = prettyTitle(ev.titulo);
      document.getElementById('posterOpen').href = poster.open;
      img.hidden = true;
      error.hidden = true;
      spinner.hidden = false;
      img.alt = `Cartel: ${prettyTitle(ev.titulo)}`;
      img.onload = () => { spinner.hidden = true; img.hidden = false; };
      img.onerror = () => { spinner.hidden = true; error.hidden = false; };
      img.src = poster.src;

      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      document.getElementById('posterClose').focus();
    }

    function closePoster() {
      const modal = document.getElementById('posterModal');
      if (modal.hidden) return;
      modal.hidden = true;
      const img = document.getElementById('posterImg');
      img.onload = img.onerror = null;
      img.removeAttribute('src');
      document.body.style.overflow = '';
      if (posterFocusReturn && posterFocusReturn.focus) posterFocusReturn.focus();
      posterFocusReturn = null;
    }

    /* =========================================================
       RENDER
       ========================================================= */
    const ICONS = {
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>',
      calendarPlus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M12 13v6M9 16h6"></path></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>',
      clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M9 14l2 2 4-4"></path></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>',
      share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>'
    };

    function infoRow(icon, innerHtml) {
      return `<div class="info-row"><span class="info-icon">${icon}</span><span>${innerHtml}</span></div>`;
    }

    function renderEventCard(ev, index, today) {
      const badge = getBadge(ev, today);
      const title = prettyTitle(ev.titulo);

      const dateRow = `<div class="info-row"><span class="info-icon">${ICONS.calendar}</span><span class="info-date">${escapeHtml(formatDateLabel(ev))}</span>${badge ? `<span class="badge ${badge.cls}">${badge.text}</span>` : ''}</div>`;
      const rows = [];
      if (ev.hora) rows.push(infoRow(ICONS.clock, escapeHtml(ev.hora)));
      if (ev.lugar) rows.push(infoRow(ICONS.pin, escapeHtml(ev.lugar)));
      if (ev.inscripcion) rows.push(infoRow(ICONS.clipboard, `<strong>Inscripción:</strong> ${linkify(ev.inscripcion)}`));

      let programBtn = '';
      let programList = '';
      if (ev.programa) {
        const items = ev.programa.split('|').map((s) => s.trim()).filter(Boolean);
        if (items.length) {
          const progId = `prog-${index}`;
          programBtn = `<button type="button" class="btn btn-primary program-toggle" aria-expanded="false" aria-controls="${progId}"><span>Ver programación</span>${ICONS.chevron}</button>`;
          programList = `<ul class="program-list" id="${progId}" hidden>${items.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
        }
      }

      const menuId = `cal-menu-${index}`;
      const saveBtn = `
        <div class="cal-wrapper${programBtn ? '' : ' grow'}">
          <button type="button" class="btn btn-save cal-btn" aria-expanded="false" aria-controls="${menuId}">${ICONS.calendarPlus}<span>Guardar</span></button>
          <div class="cal-menu" id="${menuId}" hidden>
            <a href="${buildGoogleCalendarUrl(ev)}" target="_blank" rel="noopener noreferrer">Google Calendar</a>
            <button type="button" data-ics-index="${index}">Apple / Outlook (.ics)</button>
          </div>
        </div>`;

      const shareBtn = `<a class="btn btn-share" href="${buildWhatsAppUrl(ev)}" target="_blank" rel="noopener noreferrer" aria-label="Compartir por WhatsApp">${ICONS.share}</a>`;

      return `
        <article class="event-card">
          <div class="event-content">
            <div class="event-head">
              ${ev.emoji ? `<span class="event-emoji-ball" aria-hidden="true">${escapeHtml(ev.emoji)}</span>` : ''}
              <h3 class="event-title">${escapeHtml(title)}</h3>
            </div>
            <div class="event-info">${dateRow}${rows.join('')}</div>
            ${ev.descripcion ? `<p class="event-desc">${escapeHtml(ev.descripcion)}</p>` : ''}
            ${ev.cartel && resolvePoster(ev.cartel) ? `<button type="button" class="btn btn-poster" data-poster-index="${index}">${ICONS.image}<span>Ver cartel</span></button>` : ''}
            <div class="event-actions">${programBtn}${saveBtn}${shareBtn}</div>
            ${programList}
          </div>
        </article>`;
    }

    function renderAgenda(events) {
      currentEvents = events;
      const container = document.getElementById('agendaContainer');

      if (!events.length) {
        container.innerHTML = '<div class="state-box"><p>No hay actividades próximas publicadas en este momento.</p></div>';
        return;
      }

      const today = startOfToday();
      const groups = new Map();
      events.forEach((ev, idx) => {
        ev._idx = idx;
        // Un evento ya empezado se agrupa en el mes actual, no en el de su inicio.
        const groupDate = ev.startDate < today ? today : ev.startDate;
        const key = `${groupDate.getFullYear()}-${pad(groupDate.getMonth() + 1)}`;
        if (!groups.has(key)) {
          groups.set(key, { label: `${MONTHS_FULL[groupDate.getMonth()]} ${groupDate.getFullYear()}`, items: [] });
        }
        groups.get(key).items.push(ev);
      });

      container.innerHTML = Array.from(groups.values()).map((group) => `
        <section class="month-section">
          <h2 class="month-heading">${group.label}</h2>
          <div class="events-list">
            ${group.items.map((ev) => renderEventCard(ev, ev._idx, today)).join('')}
          </div>
        </section>`).join('');
    }

    /* =========================================================
       INTERACCIÓN (un único listener para toda la página)
       ========================================================= */
    function closeCalMenus() {
      document.querySelectorAll('.cal-menu').forEach((m) => (m.hidden = true));
      document.querySelectorAll('.cal-btn').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-poster-close]')) {
        closePoster();
        return;
      }

      const posterBtn = e.target.closest('[data-poster-index]');
      if (posterBtn) {
        const ev = currentEvents[Number(posterBtn.getAttribute('data-poster-index'))];
        if (ev) openPoster(ev, posterBtn);
        return;
      }

      const progBtn = e.target.closest('.program-toggle');
      if (progBtn) {
        const list = document.getElementById(progBtn.getAttribute('aria-controls'));
        const expanded = progBtn.getAttribute('aria-expanded') === 'true';
        progBtn.setAttribute('aria-expanded', String(!expanded));
        if (list) list.hidden = expanded;
        return;
      }

      const calBtn = e.target.closest('.cal-btn');
      if (calBtn) {
        const menu = document.getElementById(calBtn.getAttribute('aria-controls'));
        const wasOpen = calBtn.getAttribute('aria-expanded') === 'true';
        closeCalMenus();
        if (!wasOpen && menu) {
          menu.hidden = false;
          calBtn.setAttribute('aria-expanded', 'true');
        }
        return;
      }

      const icsBtn = e.target.closest('[data-ics-index]');
      if (icsBtn) {
        const ev = currentEvents[Number(icsBtn.getAttribute('data-ics-index'))];
        if (ev) downloadIcsFile(ev);
      }

      if (!e.target.closest('.cal-menu')) closeCalMenus();
      else if (icsBtn || e.target.closest('.cal-menu a')) closeCalMenus();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCalMenus();
        closePoster();
      }
    });

    /* =========================================================
       CARGA DE DATOS (con copia local para usar sin conexión)
       ========================================================= */
    function processGviz(text) {
      const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
      const data = JSON.parse(jsonStr);

      let cols = data.table.cols.map((c) => (c.label || '').trim());
      let rows = data.table.rows || [];

      if (!cols.some(Boolean) && rows.length > 0 && rows[0].c) {
        cols = rows[0].c.map((cell) => (cell && cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : ''));
        rows = rows.slice(1);
      }

      const today = startOfToday();

      return rows
        .map((row, rowIndex) => {
          const obj = {};
          cols.forEach((col, i) => {
            const cell = row.c && row.c[i];
            obj[col] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '';
          });

          if (!obj.Titulo) return null;
          const startDate = parseSheetDate(obj.Fecha_Inicio);
          if (!startDate) {
            console.warn(`Agenda: fila ${rowIndex + 2} ignorada, fecha de inicio no válida:`, obj.Fecha_Inicio);
            return null;
          }
          const endDate = parseSheetDate(obj.Fecha_Fin) || startDate;

          return {
            emoji: obj.Emoji || '',
            titulo: obj.Titulo,
            startDate,
            endDate,
            hora: obj.Hora || '',
            lugar: obj.Lugar || '',
            programa: obj.Programa || '',
            inscripcion: obj.Inscripcion || '',
            descripcion: obj.Descripcion || '',
            cartel: obj.Cartel || ''
          };
        })
        .filter((ev) => ev && ev.endDate >= today)
        .sort((a, b) => {
          const diff = a.startDate - b.startDate;
          if (diff !== 0) return diff;
          return parseTimeMinutes(a.hora) - parseTimeMinutes(b.hora);
        });
    }

    function readCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed && parsed.text ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function saveCache(text) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), text }));
      } catch (e) { /* almacenamiento lleno o bloqueado: se ignora */ }
    }

    function formatWhen(ts) {
      const d = new Date(ts);
      const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      return isSameDay(d, new Date()) ? `hoy a las ${time}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} a las ${time}`;
    }

    function setStatus(mode, ts) {
      const el = document.getElementById('updateInfo');
      if (!el) return;
      if (mode === 'ok') el.textContent = `Actualizado ${formatWhen(ts)}`;
      else if (mode === 'offline') el.textContent = `Sin conexión · mostrando el último listado (${formatWhen(ts)})`;
      else el.textContent = 'Actualizando…';
    }

    async function loadEvents() {
      const container = document.getElementById('agendaContainer');
      const cached = readCache();

      // Pinta enseguida el último listado guardado mientras se consulta el Excel.
      if (cached) {
        try {
          renderAgenda(processGviz(cached.text));
          setStatus('loading');
        } catch (e) { /* copia dañada: se espera a la red */ }
      }

      try {
        const response = await fetch(GVIZ_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('Error de red al consultar la hoja');
        const text = await response.text();
        const events = processGviz(text);
        saveCache(text);
        renderAgenda(events);
        setStatus('ok', Date.now());
      } catch (err) {
        if (cached) {
          setStatus('offline', cached.ts);
        } else {
          container.innerHTML = '<div class="state-box"><p>No se ha podido cargar la agenda en este momento. Inténtalo de nuevo en unos instantes.</p></div>';
          setStatus('error');
          document.getElementById('updateInfo').textContent = 'Ayuntamiento de El Viso';
        }
      }
    }

    loadEvents();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
