<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Eventos · Ayuntamiento de El Viso</title>
  <meta name="description" content="Consulta los próximos eventos, actividades culturales, deportivas y festivas de El Viso (Córdoba).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f3f5f8;
      --bg-card: #ffffff;
      --navy: #16263b;
      --navy-soft: #243b55;
      --accent: #eab308;
      --accent-dark: #b45309;
      --accent-bg: #fef9c3;
      --text-main: #1e293b;
      --text-muted: #526071;
      --border: #e2e8f0;
      --today-bg: #dcfce7;
      --today-text: #15803d;
      --radius: 16px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Cabecera con banner de paraguas y logo circular */
    .site-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      text-align: center;
    }

    .banner-wrapper {
      position: relative;
      width: 100%;
      height: 185px;
      background: linear-gradient(135deg, #1d4ed8 0%, #16a34a 50%, #eab308 100%);
      overflow: hidden;
    }

    .banner-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .banner-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(22, 38, 59, 0.08) 40%, rgba(22, 38, 59, 0.42) 100%);
    }

    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin: -52px auto 12px;
      border-radius: 50%;
      background: #ffffff;
      padding: 5px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.14);
      z-index: 2;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      background: #ffffff;
      display: block;
    }

    .header-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      padding: 0 16px;
    }

    .header-subtitle {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Contenedor principal */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* Separador de mes */
    .month-group {
      margin-bottom: 28px;
    }

    .month-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .month-heading::before {
      content: "";
      width: 5px;
      height: 20px;
      border-radius: 4px;
      background: var(--accent);
      display: inline-block;
    }

    /* Tarjeta de evento */
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: transform 0.15s ease;
    }

    /* Columna izquierda de fecha (inspirada en diseño limpio de agenda) */
    .date-box {
      flex: 0 0 68px;
      text-align: center;
      border-top: 4px solid var(--navy);
      background: #f8fafc;
      border-radius: 0 0 10px 10px;
      padding: 8px 4px;
    }

    .date-box.is-today {
      border-top-color: #16a34a;
      background: #f0fdf4;
    }

    .date-day {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.05;
      color: var(--navy);
    }

    .date-range {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--navy);
    }

    .date-range small {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .date-month {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.04em;
    }

    /* Cuerpo del evento */
    .event-body {
      flex: 1;
      min-width: 0;
    }

    .event-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .weekday-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-dark);
    }

    .today-badge {
      background: var(--today-bg);
      color: var(--today-text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .event-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.3;
      margin-bottom: 6px;
      word-wrap: break-word;
    }

    .event-emoji {
      margin-right: 4px;
    }

    .event-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .detail-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .event-desc {
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .event-registration {
      background: var(--accent-bg);
      border-left: 3px solid var(--accent);
      color: #78350f;
      font-size: 0.83rem;
      font-weight: 500;
      padding: 7px 10px;
      border-radius: 0 8px 8px 0;
      margin-top: 8px;
    }

    /* Desplegable de horarios / programación */
    .program-toggle {
      margin-top: 10px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .program-toggle:hover {
      background: #e2e8f0;
    }

    .program-list {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
      list-style: none;
    }

    .program-list.open {
      display: block;
    }

    .program-list li {
      font-size: 0.84rem;
      color: var(--text-main);
      padding: 5px 0;
      border-bottom: 1px dashed #cbd5e1;
    }

    .program-list li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* Estados de carga y vacío */
    .status-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .site-footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 16px;
    }

    @media (min-width: 600px) {
      .banner-wrapper {
        height: 230px;
      }
      .avatar-wrapper {
        width: 116px;
        height: 116px;
        margin-top: -58px;
      }
      .header-title {
        font-size: 1.8rem;
      }
      .event-card {
        padding: 20px;
        gap: 18px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="banner-wrapper">
      <img src="cabecera.jpg" alt="Paraguas de colores en El Viso" onerror="this.style.display='none'">
    </div>
    <div class="avatar-wrapper">
      <img src="logo.jpg" alt="Logotipo Ayuntamiento de El Viso">
    </div>
    <h1 class="header-title">Agenda de Eventos</h1>
    <p class="header-subtitle">Ayuntamiento de El Viso · Córdoba</p>
  </header>

  <main class="container" id="agenda-container">
    <div class="status-box">Cargando programación actualizada...</div>
  </main>

  <footer class="site-footer">
    Ayuntamiento de El Viso · Programación actualizada
  </footer>

  <script>
    const SHEET_ID = '1ZQwG-G8eXJAhazxRedvAp55pHL5357xH2nWGz3hzzsE';
    const SHEET_NAME = 'Eventos';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const MESES_CORTOS = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    const DIAS_SEMANA = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];

    function parseSheetDate(cell) {
      if (!cell || cell.v === null || cell.v === undefined) return null;
      const val = String(cell.v).trim();
      // Formato Date(YYYY,M,D) de Google Visualization
      const gvizMatch = val.match(/^Date\((\d+),(\d+),(\d+)\)/);
      if (gvizMatch) {
        return new Date(Number(gvizMatch[1]), Number(gvizMatch[2]), Number(gvizMatch[3]));
      }
      // Formato ISO YYYY-MM-DD
      const isoMatch = val.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (isoMatch) {
        return new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]));
      }
      // Formato DD/MM/YYYY
      const esMatch = val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (esMatch) {
        return new Date(Number(esMatch[3]), Number(esMatch[2]) - 1, Number(esMatch[1]));
      }
      return null;
    }

    function getCellText(row, index) {
      if (!row.c || !row.c[index]) return '';
      const cell = row.c[index];
      return (cell.f !== undefined && cell.f !== null ? String(cell.f) : (cell.v !== null && cell.v !== undefined ? String(cell.v) : '')).trim();
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function cargarAgenda() {
      const container = document.getElementById('agenda-container');
      try {
        const res = await fetch(GVIZ_URL);
        if (!res.ok) throw new Error('Error de red');
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);

        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        const rows = (data.table && data.table.rows) ? data.table.rows : [];
        const eventos = [];

        rows.forEach((row) => {
          const titulo = getCellText(row, 2);
          if (!titulo || titulo.toLowerCase() === 'titulo') return;

          const fechaInicio = parseSheetDate(row.c ? row.c[3] : null);
          if (!fechaInicio) return;
          fechaInicio.setHours(0, 0, 0, 0);

          const fechaFinRaw = parseSheetDate(row.c ? row.c[4] : null);
          const fechaFin = fechaFinRaw ? fechaFinRaw : new Date(fechaInicio);
          fechaFin.setHours(0, 0, 0, 0);

          // Filtrar eventos pasados: mostrar solo hoy y posteriores
          if (fechaFin < hoy) return;

          eventos.push({
            emoji: getCellText(row, 1),
            titulo,
            fechaInicio,
            fechaFin,
            hora: getCellText(row, 5),
            lugar: getCellText(row, 6),
            programa: getCellText(row, 7),
            inscripcion: getCellText(row, 8),
            descripcion: getCellText(row, 9)
          });
        });

        eventos.sort((a, b) => a.fechaInicio - b.fechaInicio);

        if (eventos.length === 0) {
          container.innerHTML = '<div class="status-box">No hay eventos programados próximamente. Vuelve a consultar esta agenda en unos días.</div>';
          return;
        }

        // Agrupar por mes y año
        const grupos = new Map();
        eventos.forEach((ev) => {
          const key = `${ev.fechaInicio.getFullYear()}-${ev.fechaInicio.getMonth()}`;
          if (!grupos.has(key)) {
            grupos.set(key, {
              label: `${MESES[ev.fechaInicio.getMonth()]} ${ev.fechaInicio.getFullYear()}`,
              items: []
            });
          }
          grupos.get(key).items.push(ev);
        });

        let html = '';
        let toggleIdx = 0;

        grupos.forEach((grupo) => {
          html += `<section class="month-group">`;
          html += `<h2 class="month-heading">${escapeHtml(grupo.label)}</h2>`;

          grupo.items.forEach((ev) => {
            const esMismoDia = ev.fechaInicio.getTime() === ev.fechaFin.getTime();
            const esHoy = hoy >= ev.fechaInicio && hoy <= ev.fechaFin;

            let bloqueFecha = '';
            let textoDiaSemana = '';

            if (esMismoDia) {
              bloqueFecha = `
                <div class="date-day">${pad2(ev.fechaInicio.getDate())}</div>
                <div class="date-month">${MESES_CORTOS[ev.fechaInicio.getMonth()]}</div>
              `;
              textoDiaSemana = DIAS_SEMANA[ev.fechaInicio.getDay()];
            } else {
              const mismoMes = ev.fechaInicio.getMonth() === ev.fechaFin.getMonth();
              bloqueFecha = `
                <div class="date-range">
                  <small>DEL</small>${pad2(ev.fechaInicio.getDate())}
                  <small>AL</small>${pad2(ev.fechaFin.getDate())}
                </div>
                <div class="date-month">${mismoMes ? MESES_CORTOS[ev.fechaInicio.getMonth()] : `${MESES_CORTOS[ev.fechaInicio.getMonth()]}/${MESES_CORTOS[ev.fechaFin.getMonth()]}`}</div>
              `;
              textoDiaSemana = `DEL ${DIAS_SEMANA[ev.fechaInicio.getDay()]} AL ${DIAS_SEMANA[ev.fechaFin.getDay()]}`;
            }

            let metaHtml = '';
            if (ev.hora) {
              metaHtml += `<span class="detail-item">🕒 ${escapeHtml(ev.hora)}</span>`;
            }
            if (ev.lugar) {
              metaHtml += `<span class="detail-item">📍 ${escapeHtml(ev.lugar)}</span>`;
            }

            let programaHtml = '';
            if (ev.programa) {
              const itemsProg = ev.programa.split(/\s*\|\s*|\n+/).filter(Boolean);
              if (itemsProg.length > 0) {
                const listId = `prog-${toggleIdx++}`;
                programaHtml = `
                  <button type="button" class="program-toggle" onclick="togglePrograma('${listId}', this)">
                    Ver horarios y programación ▾
                  </button>
                  <ul class="program-list" id="${listId}">
                    ${itemsProg.map(item => `<li>${escapeHtml(item)}</li>`).join('')}
                  </ul>
                `;
              }
            }

            html += `
              <article class="event-card">
                <div class="date-box ${esHoy ? 'is-today' : ''}">
                  ${bloqueFecha}
                </div>
                <div class="event-body">
                  <div class="event-top-meta">
                    <span class="weekday-label">${textoDiaSemana}</span>
                    ${esHoy ? '<span class="today-badge">Hoy</span>' : ''}
                  </div>
                  <h3 class="event-title">
                    ${ev.emoji ? `<span class="event-emoji">${escapeHtml(ev.emoji)}</span>` : ''}${escapeHtml(ev.titulo)}
                  </h3>
                  ${metaHtml ? `<div class="event-details">${metaHtml}</div>` : ''}
                  ${ev.descripcion ? `<p class="event-desc">${escapeHtml(ev.descripcion)}</p>` : ''}
                  ${ev.inscripcion ? `<div class="event-registration"><strong>Inscripción:</strong> ${escapeHtml(ev.inscripcion)}</div>` : ''}
                  ${programaHtml}
                </div>
              </article>
            `;
          });

          html += `</section>`;
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<div class="status-box">No se ha podido cargar la agenda en este momento. Comprueba que la hoja de cálculo esté compartida como pública en modo lector.</div>';
      }
    }

    function togglePrograma(id, btn) {
      const list = document.getElementById(id);
      const isOpen = list.classList.toggle('open');
      btn.textContent = isOpen ? 'Ocultar programación ▴' : 'Ver horarios y programación ▾';
    }

    cargarAgenda();
  </script>
</body>
</html>
