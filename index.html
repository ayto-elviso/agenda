<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2942" />
  <meta name="description" content="Agenda de Eventos · Ayuntamiento de El Viso · Córdoba" />
  <title>Agenda de Eventos · Ayuntamiento de El Viso</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-navy: #0f2942;
      --brand-navy-light: #1b436b;
      --brand-gold: #e0a800;
      --bg-page: #f3f5f8;
      --bg-card: #ffffff;
      --text-main: #182230;
      --text-muted: #526075;
      --border-subtle: #e2e8f0;
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.05);
      --radius-card: 14px;
      --radius-pill: 999px;

      /* Línea superior discreta de la caja de fecha según estación */
      --season-bar: #60a5fa;
    }

    /* Invierno: Dic, Ene, Feb (Azul suave) */
    .season-invierno {
      --season-bar: #60a5fa;
    }

    /* Primavera: Mar, Abr, May (Verde amarillento) */
    .season-primavera {
      --season-bar: #a3e635;
    }

    /* Verano: Jun, Jul, Ago (Rojo anaranjado) */
    .season-verano {
      --season-bar: #fb923c;
    }

    /* Otoño: Sep, Oct, Nov (Naranja amarillento) */
    .season-otono {
      --season-bar: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Cabecera original con imagen superior e icono circular de El Viso */
    .site-header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-subtle);
      text-align: center;
      padding-bottom: 1.45rem;
    }

    .header-banner {
      width: 100%;
      height: 155px;
      overflow: hidden;
      background-color: var(--brand-navy);
    }

    .header-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-logo-wrap {
      width: 96px;
      height: 96px;
      margin: -48px auto 0.75rem;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      z-index: 2;
    }

    .header-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .header-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--brand-navy);
      line-height: 1.2;
      letter-spacing: -0.02em;
      padding: 0 1rem;
    }

    .header-subtitle {
      margin-top: 0.25rem;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 0 1rem;
    }

    /* Contenedor principal */
    .main-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.4rem 1rem 2.5rem;
    }

    .month-section {
      margin-bottom: 2.1rem;
    }

    /* Cabecera de mes con barra vertical amarilla */
    .month-heading {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.32rem;
      font-weight: 800;
      color: var(--brand-navy);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 0.95rem;
    }

    .month-heading::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 1.2em;
      background-color: var(--brand-gold);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    /* Tarjeta de evento: limpia, sin resaltar medianos/grandes */
    .event-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: flex-start;
      padding: 0.95rem;
      gap: 0.95rem;
    }

    /* Caja de fecha discreta: fondo neutro y solo línea superior de estación */
    .event-date {
      flex: 0 0 74px;
      width: 74px;
      background-color: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-top: 4px solid var(--season-bar);
      border-radius: 10px;
      padding: 0.5rem 0.3rem 0.55rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      user-select: none;
    }

    .today-pill {
      background-color: var(--brand-navy);
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-pill);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }

    .date-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.15;
    }

    .date-dow {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .date-day {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 0.08rem 0;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .date-month {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .date-divider {
      display: block;
      width: 38px;
      height: 1px;
      background-color: #cbd5e1;
      margin: 0.42rem 0;
    }

    /* Columna derecha: todo alineado arriba */
    .event-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* Línea superior de hora y lugar */
    .event-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.85rem;
      margin-bottom: 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
    }

    .meta-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: var(--text-muted);
    }

    /* Título con emoji alineado a la izquierda */
    .event-title-row {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      width: 100%;
    }

    .event-emoji {
      font-size: 1.15rem;
      line-height: 1.28;
      flex-shrink: 0;
    }

    .event-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.28;
      letter-spacing: -0.01em;
    }

    .event-desc {
      margin-top: 0.45rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Bloque de inscripción discreto */
    .event-inscription {
      margin-top: 0.55rem;
      width: 100%;
      background-color: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 0.45rem 0.7rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.84rem;
      color: var(--text-main);
    }

    .event-inscription strong {
      color: var(--brand-navy);
    }

    .event-inscription a {
      color: var(--brand-navy-light);
      font-weight: 700;
      text-decoration: underline;
    }

    /* Fila horizontal de botones: Ver programación + Guardar */
    .event-actions-row {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      width: 100%;
    }

    .program-toggle {
      appearance: none;
      background-color: #f1f5f9;
      border: 1px solid #dbe3ee;
      color: var(--brand-navy);
      font-family: inherit;
      font-size: 0.81rem;
      font-weight: 700;
      padding: 0.42rem 0.78rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background-color 0.15s ease;
    }

    .program-toggle:hover {
      background-color: #e2e8f0;
    }

    .program-toggle svg {
      width: 14px;
      height: 14px;
      transition: transform 0.18s ease;
    }

    .program-toggle[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .cal-wrapper {
      position: relative;
    }

    .cal-btn {
      appearance: none;
      background-color: transparent;
      border: 1px solid #e2e8f0;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.79rem;
      font-weight: 600;
      padding: 0.42rem 0.68rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
    }

    .cal-btn:hover {
      border-color: #cbd5e1;
      color: var(--brand-navy);
      background-color: #f8fafc;
    }

    .cal-menu {
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      background-color: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.14);
      padding: 0.35rem;
      min-width: 185px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .cal-menu[hidden] {
      display: none;
    }

    .cal-menu a,
    .cal-menu button {
      appearance: none;
      border: none;
      background: transparent;
      text-align: left;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      padding: 0.46rem 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      display: block;
      width: 100%;
    }

    .cal-menu a:hover,
    .cal-menu button:hover {
      background-color: #f1f5f9;
      color: var(--brand-navy);
    }

    /* Lista desplegable de programación */
    .program-list {
      margin-top: 0.55rem;
      width: 100%;
      padding: 0.6rem 0.8rem;
      background-color: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.84rem;
    }

    .program-list[hidden] {
      display: none;
    }

    .program-list li {
      position: relative;
      padding-left: 0.8rem;
      color: var(--text-main);
    }

    .program-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.54em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--brand-navy);
    }

    /* Estados de carga y vacío */
    .state-box {
      background-color: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 2rem 1.4rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.93rem;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--brand-navy);
      border-radius: 50%;
      margin: 0 auto 0.8rem;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .site-footer {
      text-align: center;
      padding: 0.5rem 1rem 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 540px) {
      .header-banner {
        height: 140px;
      }

      .event-card {
        padding: 0.82rem;
        gap: 0.78rem;
      }

      .event-date {
        flex: 0 0 68px;
        width: 68px;
        padding: 0.48rem 0.25rem 0.52rem;
      }

      .date-dow,
      .date-month {
        font-size: 0.7rem;
      }

      .date-day {
        font-size: 1.3rem;
      }

      .event-title {
        font-size: 0.96rem;
      }

      .month-heading {
        font-size: 1.24rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-banner">
      <img src="cabecera.jpg" alt="El Viso" />
    </div>
    <div class="header-logo-wrap">
      <img src="logo.jpg" alt="Ayuntamiento de El Viso" />
    </div>
    <h1 class="header-title">Agenda de Eventos</h1>
    <p class="header-subtitle">Ayuntamiento de El Viso · Córdoba</p>
  </header>

  <main class="main-container" id="agendaContainer">
    <div class="state-box" id="loadingState">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando programación actualizada…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Ayuntamiento de El Viso · Programación actualizada</p>
  </footer>

  <script>
    const SHEET_ID = '1ZQwG-G8eXJAhazxRedvAp55pHL5357xH2nWGz3hzzsE';
    const SHEET_NAME = 'Eventos';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    const DAYS_3 = ['Dom.', 'Lun.', 'Mar.', 'Mié.', 'Jue.', 'Vie.', 'Sáb.'];
    const MONTHS_3 = ['Ene.', 'Feb.', 'Mar.', 'Abr.', 'May.', 'Jun.', 'Jul.', 'Ago.', 'Sep.', 'Oct.', 'Nov.', 'Dic.'];
    const MONTHS_FULL = [
      'ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO',
      'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'
    ];

    function getSeasonClassByMonth(monthIndex0) {
      if (monthIndex0 === 11 || monthIndex0 === 0 || monthIndex0 === 1) return 'season-invierno';
      if (monthIndex0 >= 2 && monthIndex0 <= 4) return 'season-primavera';
      if (monthIndex0 >= 5 && monthIndex0 <= 7) return 'season-verano';
      return 'season-otono';
    }

    function parseSheetDate(raw) {
      if (!raw) return null;
      const str = String(raw).trim();
      if (!str) return null;

      const gvizMatch = str.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)/);
      if (gvizMatch) {
        return new Date(Number(gvizMatch[1]), Number(gvizMatch[2]), Number(gvizMatch[3]));
      }

      const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (isoMatch) {
        return new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]));
      }

      const esMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (esMatch) {
        return new Date(Number(esMatch[3]), Number(esMatch[2]) - 1, Number(esMatch[1]));
      }

      return null;
    }

    function isSameDay(a, b) {
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function parseTimeMinutes(horaStr) {
      if (!horaStr) return 9999;
      const match = String(horaStr).match(/(\d{1,2}):(\d{2})/);
      if (!match) return 9999;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function linkify(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function formatGoogleCalendarDates(startDate, endDate, horaStr) {
      const timeMatch = horaStr ? String(horaStr).match(/(\d{1,2}):(\d{2})/) : null;
      const pad = (n) => String(n).padStart(2, '0');

      if (timeMatch && isSameDay(startDate, endDate)) {
        const hh = Number(timeMatch[1]);
        const mm = Number(timeMatch[2]);
        const endHh = (hh + 1) % 24;
        const ymd = `${startDate.getFullYear()}${pad(startDate.getMonth() + 1)}${pad(startDate.getDate())}`;
        return `${ymd}T${pad(hh)}${pad(mm)}00/${ymd}T${pad(endHh)}${pad(mm)}00`;
      }

      const nextDay = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate() + 1);
      const startYmd = `${startDate.getFullYear()}${pad(startDate.getMonth() + 1)}${pad(startDate.getDate())}`;
      const endYmd = `${nextDay.getFullYear()}${pad(nextDay.getMonth() + 1)}${pad(nextDay.getDate())}`;
      return `${startYmd}/${endYmd}`;
    }

    function buildGoogleCalendarUrl(ev) {
      const dates = formatGoogleCalendarDates(ev.startDate, ev.endDate, ev.hora);
      const detailsParts = [];
      if (ev.descripcion) detailsParts.push(ev.descripcion);
      if (ev.programa) detailsParts.push('Programa: ' + ev.programa.replace(/\s*\|\s*/g, ' · '));
      if (ev.inscripcion) detailsParts.push('Inscripción: ' + ev.inscripcion);

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: ev.titulo,
        dates: dates,
        details: detailsParts.join('\n\n'),
        location: ev.lugar ? `${ev.lugar}, El Viso (Córdoba)` : 'El Viso, Córdoba',
        ctz: 'Europe/Madrid'
      });

      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function downloadIcsFile(ev) {
      const pad = (n) => String(n).padStart(2, '0');
      const timeMatch = ev.hora ? String(ev.hora).match(/(\d{1,2}):(\d{2})/) : null;
      let dtStartLine = '';
      let dtEndLine = '';

      if (timeMatch && isSameDay(ev.startDate, ev.endDate)) {
        const hh = Number(timeMatch[1]);
        const mm = Number(timeMatch[2]);
        const endHh = (hh + 1) % 24;
        const ymd = `${ev.startDate.getFullYear()}${pad(ev.startDate.getMonth() + 1)}${pad(ev.startDate.getDate())}`;
        dtStartLine = `DTSTART;TZID=Europe/Madrid:${ymd}T${pad(hh)}${pad(mm)}00`;
        dtEndLine = `DTEND;TZID=Europe/Madrid:${ymd}T${pad(endHh)}${pad(mm)}00`;
      } else {
        const nextDay = new Date(ev.endDate.getFullYear(), ev.endDate.getMonth(), ev.endDate.getDate() + 1);
        const startYmd = `${ev.startDate.getFullYear()}${pad(ev.startDate.getMonth() + 1)}${pad(ev.startDate.getDate())}`;
        const endYmd = `${nextDay.getFullYear()}${pad(nextDay.getMonth() + 1)}${pad(nextDay.getDate())}`;
        dtStartLine = `DTSTART;VALUE=DATE:${startYmd}`;
        dtEndLine = `DTEND;VALUE=DATE:${endYmd}`;
      }

      const desc = [ev.descripcion, ev.programa ? 'Programa: ' + ev.programa : '', ev.inscripcion ? 'Inscripción: ' + ev.inscripcion : '']
        .filter(Boolean)
        .join('\\n\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');

      const location = (ev.lugar ? `${ev.lugar}, El Viso (Córdoba)` : 'El Viso, Córdoba')
        .replace(/,/g, '\\,');

      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Ayuntamiento de El Viso//Agenda Publica//ES',
        'CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@elviso.es`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        dtStartLine,
        dtEndLine,
        `SUMMARY:${ev.titulo.replace(/,/g, '\\,')}`,
        `DESCRIPTION:${desc}`,
        `LOCATION:${location}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${ev.titulo.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi, '-')}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderDateColumn(startDate, endDate, isToday) {
      const isRange = endDate && !isSameDay(startDate, endDate);
      const todayBadge = isToday ? `<span class="today-pill">Hoy</span>` : '';

      if (isRange) {
        return `
          <div class="event-date">
            ${todayBadge}
            <div class="date-point">
              <span class="date-dow">De ${DAYS_3[startDate.getDay()]}</span>
              <span class="date-day">${startDate.getDate()}</span>
              <span class="date-month">${MONTHS_3[startDate.getMonth()]}</span>
            </div>
            <span class="date-divider" aria-hidden="true"></span>
            <div class="date-point">
              <span class="date-dow">A ${DAYS_3[endDate.getDay()]}</span>
              <span class="date-day">${endDate.getDate()}</span>
              <span class="date-month">${MONTHS_3[endDate.getMonth()]}</span>
            </div>
          </div>
        `;
      }

      return `
        <div class="event-date">
          ${todayBadge}
          <div class="date-point">
            <span class="date-dow">${DAYS_3[startDate.getDay()]}</span>
            <span class="date-day">${startDate.getDate()}</span>
            <span class="date-month">${MONTHS_3[startDate.getMonth()]}</span>
          </div>
        </div>
      `;
    }

    function renderEventCard(ev, index, today) {
      const seasonClass = getSeasonClassByMonth(ev.startDate.getMonth());
      const isToday = today >= ev.startDate && today <= ev.endDate;
      const dateHtml = renderDateColumn(ev.startDate, ev.endDate, isToday);

      const metaItems = [];
      if (ev.hora) {
        metaItems.push(`
          <span class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>${escapeHtml(ev.hora)}</span>
          </span>
        `);
      }
      if (ev.lugar) {
        metaItems.push(`
          <span class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span>${escapeHtml(ev.lugar)}</span>
          </span>
        `);
      }

      const metaHtml = metaItems.length ? `<div class="event-meta">${metaItems.join('')}</div>` : '';
      const descHtml = ev.descripcion ? `<p class="event-desc">${escapeHtml(ev.descripcion)}</p>` : '';

      const inscriptionHtml = ev.inscripcion
        ? `<div class="event-inscription"><strong>Inscripción:</strong> ${linkify(ev.inscripcion)}</div>`
        : '';

      let programBtnHtml = '';
      let programListHtml = '';
      if (ev.programa) {
        const items = ev.programa.split('|').map((s) => s.trim()).filter(Boolean);
        if (items.length) {
          const progId = `prog-${index}`;
          programBtnHtml = `
            <button type="button" class="program-toggle" aria-expanded="false" aria-controls="${progId}">
              <span>Ver programación</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          `;
          programListHtml = `
            <ul class="program-list" id="${progId}" hidden>
              ${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
            </ul>
          `;
        }
      }

      const calMenuId = `cal-menu-${index}`;
      const gcalUrl = buildGoogleCalendarUrl(ev);

      return `
        <article class="event-card ${seasonClass}">
          ${dateHtml}
          <div class="event-body">
            ${metaHtml}
            <div class="event-title-row">
              ${ev.emoji ? `<span class="event-emoji" aria-hidden="true">${escapeHtml(ev.emoji)}</span>` : ''}
              <h3 class="event-title">${escapeHtml(ev.titulo)}</h3>
            </div>
            ${descHtml}
            ${inscriptionHtml}
            <div class="event-actions-row">
              ${programBtnHtml}
              <div class="cal-wrapper">
                <button type="button" class="cal-btn" aria-expanded="false" aria-controls="${calMenuId}">
                  <span aria-hidden="true">📅</span>
                  <span>Guardar</span>
                </button>
                <div class="cal-menu" id="${calMenuId}" hidden>
                  <a href="${gcalUrl}" target="_blank" rel="noopener noreferrer">Google Calendar</a>
                  <button type="button" data-ics-index="${index}">Apple / Outlook (.ics)</button>
                </div>
              </div>
            </div>
            ${programListHtml}
          </div>
        </article>
      `;
    }

    function renderAgenda(events) {
      const container = document.getElementById('agendaContainer');

      if (!events.length) {
        container.innerHTML = `
          <div class="state-box">
            <p>No hay actividades próximas publicadas en este momento.</p>
          </div>
        `;
        return;
      }

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const groups = new Map();
      events.forEach((ev, idx) => {
        ev._idx = idx;
        const key = `${ev.startDate.getFullYear()}-${String(ev.startDate.getMonth() + 1).padStart(2, '0')}`;
        if (!groups.has(key)) {
          groups.set(key, {
            key,
            label: `${MONTHS_FULL[ev.startDate.getMonth()]} ${ev.startDate.getFullYear()}`,
            items: []
          });
        }
        groups.get(key).items.push(ev);
      });

      const groupList = Array.from(groups.values());

      container.innerHTML = groupList.map((group) => `
        <section class="month-section">
          <h2 class="month-heading">${group.label}</h2>
          <div class="events-list">
            ${group.items.map((ev) => renderEventCard(ev, ev._idx, today)).join('')}
          </div>
        </section>
      `).join('');

      container.addEventListener('click', (e) => {
        const progBtn = e.target.closest('.program-toggle');
        if (progBtn) {
          const list = document.getElementById(progBtn.getAttribute('aria-controls'));
          const expanded = progBtn.getAttribute('aria-expanded') === 'true';
          progBtn.setAttribute('aria-expanded', String(!expanded));
          list.hidden = expanded;
          return;
        }

        const calBtn = e.target.closest('.cal-btn');
        if (calBtn) {
          e.stopPropagation();
          const menu = document.getElementById(calBtn.getAttribute('aria-controls'));
          const wasOpen = calBtn.getAttribute('aria-expanded') === 'true';
          document.querySelectorAll('.cal-menu').forEach((m) => (m.hidden = true));
          document.querySelectorAll('.cal-btn').forEach((b) => b.setAttribute('aria-expanded', 'false'));
          if (!wasOpen) {
            menu.hidden = false;
            calBtn.setAttribute('aria-expanded', 'true');
          }
          return;
        }

        const icsBtn = e.target.closest('[data-ics-index]');
        if (icsBtn) {
          const ev = events[Number(icsBtn.getAttribute('data-ics-index'))];
          if (ev) downloadIcsFile(ev);
          document.querySelectorAll('.cal-menu').forEach((m) => (m.hidden = true));
          document.querySelectorAll('.cal-btn').forEach((b) => b.setAttribute('aria-expanded', 'false'));
        }
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.cal-menu').forEach((m) => (m.hidden = true));
        document.querySelectorAll('.cal-btn').forEach((b) => b.setAttribute('aria-expanded', 'false'));
      });
    }

    async function loadEvents() {
      const container = document.getElementById('agendaContainer');
      try {
        const response = await fetch(GVIZ_URL);
        if (!response.ok) throw new Error('Error de red al consultar la hoja');
        const text = await response.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);

        let cols = data.table.cols.map((c) => (c.label || '').trim());
        let rows = data.table.rows || [];

        if (!cols.some(Boolean) && rows.length > 0 && rows[0].c) {
          cols = rows[0].c.map((cell) => (cell && cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : ''));
          rows = rows.slice(1);
        }

        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const events = rows
          .map((row) => {
            const obj = {};
            cols.forEach((col, i) => {
              const cell = row.c && row.c[i];
              obj[col] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '';
            });

            const startDate = parseSheetDate(obj.Fecha_Inicio);
            if (!startDate || !obj.Titulo) return null;
            const endDate = parseSheetDate(obj.Fecha_Fin) || startDate;

            return {
              tipo: obj.Tipo || 'Pequeño',
              emoji: obj.Emoji || '',
              titulo: obj.Titulo,
              startDate,
              endDate,
              hora: obj.Hora || '',
              lugar: obj.Lugar || '',
              programa: obj.Programa || '',
              inscripcion: obj.Inscripcion || '',
              descripcion: obj.Descripcion || ''
            };
          })
          .filter((ev) => ev && ev.endDate >= today)
          .sort((a, b) => {
            const diff = a.startDate - b.startDate;
            if (diff !== 0) return diff;
            return parseTimeMinutes(a.hora) - parseTimeMinutes(b.hora);
          });

        renderAgenda(events);
      } catch (err) {
        container.innerHTML = `
          <div class="state-box">
            <p>No se ha podido cargar la agenda en este momento. Inténtalo de nuevo en unos instantes.</p>
          </div>
        `;
      }
    }

    loadEvents();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
